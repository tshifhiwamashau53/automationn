server {
    listen 80;
    server_name deploy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name deploy.example.com;

    root /var/www/myapp/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/deploy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-deploy.sock; # custom socket for deploy pool
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Optional: add rate-limiting or allow/deny by IP here
}
